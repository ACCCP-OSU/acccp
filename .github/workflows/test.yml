name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm install instead of npm ci: the lockfile is maintained on Windows, where
      # npm drops wasm/Linux-only optional deps that npm ci on Linux then requires
      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm install instead of npm ci: the lockfile is maintained on Windows, where
      # npm drops wasm/Linux-only optional deps that npm ci on Linux then requires
      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test
